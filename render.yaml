services:
  # IncidentFlow Backend REST API
  - type: web
    name: incidentflow-backend
    env: node
    plan: free
    buildCommand: npm install --prefix backend && npm run build --prefix backend
    startCommand: cd backend && npx prisma db push && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: incidentflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEBHOOK_SECRET
        generateValue: true

  # IncidentFlow Frontend SPA
  - type: web
    name: incidentflow-frontend
    env: static
    plan: free
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: incidentflow-backend
          envVarKey: RENDER_EXTERNAL_URL
          transform: "${VALUE}/api"

databases:
  # Managed PostgreSQL Database
  - name: incidentflow-db
    plan: free
    databaseName: incidentflow
    user: postgres
